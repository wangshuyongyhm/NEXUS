[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusos-common"
version = "1.0.0"
description = "nexusos-common — NEXUS 四包共享锚点解析（NEXUS_HOME / vault_root / task_root / subpath / expand_env + 私路径 lint）"
readme = "README.md"
requires-python = ">=3.10"
# PEP 621 旧式 text 表（同 nexusos-mem：防 setuptools>=77 PEP639 拒绝）
license = {text = "MIT"}
authors = [{name = "NEXUS Contributors"}]
classifiers = ["License :: OSI Approved :: MIT License"]
# 零三方依赖红线（1955 design §3.2）
dependencies = []

# nexus CLI 入口（1965 向导：pipx 装完即 `nexus` 命令）
[project.scripts]
nexus = "nexusos_common.cli:main"

[project.urls]
Homepage = "https://github.com/nexus-family/nexusos-common"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexusos_common = ["py.typed"]
