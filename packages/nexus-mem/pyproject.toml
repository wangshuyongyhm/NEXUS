[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-mem"
version = "0.1.0"
description = "NEXUS MEM — shared agent knowledge base: FTS+vector hybrid search, experience write-back, apply-outcome honesty"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
# Layered deps: core is lightweight; BGE-M3 embedding stack is opt-in via [full].
dependencies = [
    "psycopg2-binary>=2.9",
    "pyyaml>=5.4",
    "jieba>=0.42",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=2.2",
    "torch",
    "transformers>=4.36",
    "FlagEmbedding>=1.2",
]

[project.urls]
Homepage = "https://github.com/nexus-oss/nexus-oss"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_mem"]
