# loop_start 场景门禁 — LOOP 全自动模式启动前置硬条件
# 对应 loop-auto-advance.md §0.5 启动门槛的代码强制层
# Agent 进入 LOOP 前调 gate_check(scenario=loop_start)，passed=true 才进
version: 1
scenario: loop_start
description: LOOP 全自动模式启动门禁（目标95%+四象限全清+方法论就位+完成判据）
required_context:
  - {name: goal, desc: "本轮目标陈述", required: true}
  - {name: quadrant_issues, desc: "四象限拆出的待办(已解决)", required: true}
  - {name: methodology_ready, desc: "方法论就绪声明", required: true}
  - {name: completion_criteria, desc: "完成判定标准", required: true}
  # Task531 B8: session_id（recover 按会话筛 checkpoint 防串，可不填）
  - {name: session_id, desc: "LOOP 会话标识(recover 按 session 筛 checkpoint)", required: false}
items:
  # L1: 目标充分（≥10字）——避免"修一下""搞定X"这种模糊目标进 LOOP
  - id: L1
    name: goal 充分（≥10字）
    auto: true
    severity: REJECT
    check:
      type: field_check
      jsonpath: goal
      min_len: 10

  # L2: 四象限待办非空——必须拆出具体待办（KU 转行动项）
  - id: L2
    name: quadrant_issues 非空
    auto: true
    severity: REJECT
    check:
      type: field_check
      jsonpath: quadrant_issues
      min_len: 1

  # L3: 方法论应用具体描述（≥20字）——反作弊：不能只填"就绪"关键词蒙混，必须描述具体用了哪些方法论（如"第一性原理找根因+对抗式扫漏洞"）
  - id: L3
    name: methodology_ready 具体描述（≥20字）
    auto: true
    severity: REJECT
    check:
      type: field_check
      jsonpath: methodology_ready
      min_len: 20

  # L4: 完成判据明确（≥5字）——LOOP 必须有可判定的完成标准
  - id: L4
    name: completion_criteria 明确（≥5字）
    auto: true
    severity: REJECT
    check:
      type: field_check
      jsonpath: completion_criteria
      min_len: 5
