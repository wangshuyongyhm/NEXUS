# loop_complete 场景门禁 — LOOP 全自动模式退出前置（目标达成对账）
# 对应 loop-auto-advance.md §5/§8 的代码强制层
# Agent 退出 LOOP 前调 gate_check(scenario=loop_complete)，passed=true 才退
version: 1
scenario: loop_complete
description: LOOP 退出前出口门禁（goal对账+完成判定逐条+用户验收）
required_context:
  - {name: goal, desc: "原始目标(loop_start 时的)", required: true}
  - {name: deliverables, desc: "实际产出清单(文件/成果)", required: true}
  - {name: completion_criteria, desc: "完成判定标准(逐条对照)", required: true}
  - {name: user_verified, desc: "用户验收状态(verified/代理验收/待验收)", required: true}
items:
  # LC1: 产出锚定目标——deliverables 必须具体(≥10字,非空话)
  - id: LC1
    name: deliverables 具体产出（≥10字）
    auto: true
    severity: REJECT
    check:
      type: field_check
      jsonpath: deliverables
      min_len: 10

  # LC2: 完成判定逐条对照——completion_criteria 非空(要有可判定标准)
  - id: LC2
    name: completion_criteria 逐条对照（≥5字）
    auto: true
    severity: REJECT
    check:
      type: field_check
      jsonpath: completion_criteria
      min_len: 5

  # LC3: 用户验收状态——含 verified/验收/通过/代理（离线模式代理验收）
  # WARN（非 REJECT）：离线模式用户不在，"代理验收"应允许退出，只提醒后续补用户主观验收
  - id: LC3
    name: user_verified 验收状态
    auto: true
    severity: WARN
    check:
      type: command
      cmd: 'echo "{user_verified}" | grep -qiE "verified|验收|通过|代理|待验收" && exit 0 || exit 1'
      expect_rc: 0
      timeout: 5
