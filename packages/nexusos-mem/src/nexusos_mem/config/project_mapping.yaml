# project_mapping.yaml — shadow_match.py 项目映射（Task 282 P2-6）
# 原 nexus/shadow_match.py:150 _PROJECT_DEFAULT + L176 _PROJECT_NS 硬编码

# 项目默认编码（project → 默认 SHADOW 编码前缀）
project_default:
  stzb: CA        # stzb 项目 MOC（C*=L2）
  nexusos-mem: B    # NEXUS-CONSTRAINT/write.py（B*=L1）
  nm: B
  system: B

# knowledge.project → 命名空间（跨项目误配防护）
project_ns:
  stzb: stzb
  nexusos-mem: system
  nm: system
  system: system

# target 字段 → 命名空间推断规则（_code_namespace 用）
# 按 key 顺序匹配，命中即返回
namespace_rules:
  - keyword: stzb
    ns: stzb
  - keyword: fengkuang
    ns: fengkuang
  - keyword: 02-skills
    ns: skills
  - keyword: skills
    ns: skills
  - keywords_any:
      - nexus-constraint
      - shadow
      - 环境经验
      - 体系运维
      - 工作流
      - 用户偏好
      - 通用经验
      - 检查点
      - 经验治理
      - 检索优先
    ns: system
  - keyword: meituan
    ns: meituan
