[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-xdr"
version = "1.0.0"
description = "NEXUS XDR — agent message bus: dispatch/callback/task-state, presence registry, HMAC credentials"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
dependencies = [
    # Internal deps are versioned (lesson from the private repo: unversioned
    # internal deps break resolution at publish time).
    "nexus-gatekit>=0.1.0",
    "nexus-mem>=0.1.0",
    "fastmcp>=3.4.4,<3.5",
    "anyio>=4.0",
    "starlette>=0.37",
    "psycopg2-binary>=2.9",
    "pyyaml>=5.4",
]

[project.urls]
Homepage = "https://github.com/wangshuyongyhm/NEXUS"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_xdr"]
