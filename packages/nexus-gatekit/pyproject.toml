[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-gatekit"
version = "0.1.0"
description = "NEXUS GateKit — declarative pre-commit/dispatch/persist gate engine (REJECT/WARN checks as YAML)"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
# Renamed from private 'nexus-gate': the PyPI name was taken by an unrelated
# project. Import path is nexus_gatekit.
dependencies = ["pyyaml>=5.4"]

[project.urls]
Homepage = "https://github.com/wangshuyongyhm/NEXUS"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_gatekit"]
