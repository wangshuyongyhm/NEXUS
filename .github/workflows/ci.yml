# ci.yml — NEXUS skeleton repo CI (minimal: install + pytest smoke)
# Badge anchor: README CI badge points here once the repo is public.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages (editable, no optional deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          for p in packages/*/; do pip install -e "$p" --no-deps; done

      - name: Import smoke
        run: |
          python - <<'PY'
          import importlib
          for mod in ("nexus_oss",):
              importlib.import_module(mod)
              print("import OK:", mod)
          PY

      - name: pytest smoke (tolerate empty suites during skeleton phase)
        run: |
          pip install pytest
          pytest -q packages/ || [ $? -eq 5 ]
