name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install zero-dependency core (nexusos-common)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/nexusos-common
          pip install pytest
      - name: Core unit tests (anchors / layout / env resolution)
        run: pytest packages/nexusos-common -q
      - name: Docs sanity (bilingual README pair exists)
        run: test -f README.md && test -f README.zh-CN.md && test -f starter-vault/AGENTS.md && echo "docs ok"
