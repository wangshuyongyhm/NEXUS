# sync-manifest.yaml — 主仓→公开仓白名单（sync-strategy.md 三道闸之①）
# 规则：显式枚举文件，不用目录通配——新增文件默认不同步。
# 执行：MAIN_REPO=<主仓路径> tools/sync-scrub.py --manifest（先过内容闸再拷贝）。
# 1558 已泄露集合（keys.json / MEM 快照 / task 密钥文件）永久黑名单，永不在此列。
#
# ── A3a 填充（task/2611172038，池 #616）设计依据 ─────────────────────────
# 闸①(1575 sync-strategy §2): 文件级显式枚举，宁窄勿宽。
# 分叉不列（1976 拍板/发布配置域）: xdr agents/* 私 fleet 21 文件、各包 pyproject.toml、
#   mem/xdr README.md（OSS 门面改写域）、xdr agents/__init__.py（OSS 公开层）。
# 私敏剔除(scrub 实拦): gates/data/external-disk-paths.yaml(个人卷标×7)、
#   _checks/relocate_pointer_solid.py(硬编码 stzb 资产路径)。
# tests 口径: 交集既有 tests 保留(common 6 + gate _checks/tests 7，1949 已开源先例)，
#   主仓新增 tests 不扩面(A3b 决策)。
# 改名映射: 主仓 examples-src/gates/* → 公开仓 examples/gates/*。
# 内容闸豁免见 tools/sync-scrub.py FILE_EXEMPT（逐文件审计理由）。

