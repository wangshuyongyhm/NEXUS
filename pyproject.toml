[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-oss"
version = "0.1.0"
description = "NEXUS — personal multi-agent operating system (meta package; see packages/ for the real components)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
authors = [{ name = "NEXUS Contributors" }]
keywords = ["multi-agent", "llm", "knowledge-base", "message-bus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# Meta package carries no heavy deps; install packages/* individually.
dependencies = []

[project.scripts]
nexus = "nexus_oss.cli:main"

[project.urls]
Homepage = "https://github.com/nexus-oss/nexus-oss"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_oss"]
